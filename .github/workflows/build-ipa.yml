name: Compilar IPA de Pulso (iOS)

# Genera un .ipa SIN firmar en un Mac de GitHub.
# Luego se firma e instala con Sideloadly/AltStore usando tu Apple ID.
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'pulso/**'
      - 'ios/**'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/build-ipa.yml'

jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: npm ci || npm install

      - name: Copiar la web al proyecto iOS
        run: npx cap sync ios

      - name: Compilar sin firma
        run: |
          cd ios/App
          echo "== Esquemas disponibles =="
          xcodebuild -project App.xcodeproj -list || true
          echo "== Compilando =="
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build \
          || xcodebuild \
            -project App.xcodeproj \
            -target App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Empaquetar el .ipa
        run: |
          APP=$(find ios/App/build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "App: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Pulso.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: pulso-ipa
          path: Pulso.ipa
          if-no-files-found: error

